<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.png" type="image/png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140b06">
<meta name="description" content="Deepworks — an idle optimization game. Assign workers, upgrade shafts and transport, and optimize throughput in a glowing underground mine.">
<title>Deepworks</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23140b06'/><path d='M8 2l4 6-4 6-4-6z' fill='%23ff9a3c'/></svg>">
<script src="sh-language.js"></script>
<script src="game-options.js" data-game="deepworks"></script>
<script src="ui-scale.js"></script>
<script src="browser-guard.js"></script>
</head>
<body>
<a class="skip-link" href="#main-ui" data-i18n="Skip to game controls">Skip to game controls</a>
<div id="app">
  <!-- Three.js canvas host: never the only UI (spec §3) -->
  <div id="scene-host" aria-hidden="true"></div>
  <!-- DOM labels aligned to projected 3D targets -->
  <div id="layer-labels" aria-hidden="true"></div>

  <main id="main-ui">
    <!-- ======================= PLAY HUD ======================= -->
    <div id="hud" class="hidden" role="region" aria-label="Mine controls" data-i18n-aria="Mine controls">
      <header id="hud-top">
        <div id="hud-objective" class="hud-cell">
          <span class="hud-label" data-i18n="Objective">Objective</span>
          <span id="objective-text">—</span>
          <div id="objective-bar" class="meter" hidden><div id="objective-fill"></div></div>
        </div>
        <div id="hud-resources" class="hud-cell" role="status" aria-live="off">
          <span class="res" title="Credits" data-i18n-title="Credits"><span class="res-ico" aria-hidden="true">◈</span><span id="res-credits">0</span></span>
          <span class="res" title="Income per second" data-i18n-title="Income per second"><span class="res-ico" aria-hidden="true">↻</span><span id="res-income">0/s</span></span>
          <span class="res" title="Workers (idle/total)" data-i18n-title="Workers (idle/total)"><span class="res-ico" aria-hidden="true">⚒</span><span id="res-workers">0/0</span></span>
        </div>
        <div id="hud-clock" class="hud-cell">
          <span id="hud-timer">0:00</span>
          <button id="btn-pause" class="btn icon-btn" aria-label="Pause (Esc)" data-i18n-aria="Pause (Esc)">⏸</button>
        </div>
      </header>

      <aside id="hud-left" class="rail" aria-label="Objective and progress" data-i18n-aria="Objective and progress">
        <h2 class="rail-title" data-i18n="Shift Report">Shift Report</h2>
        <div id="left-rail-body"></div>
      </aside>

      <aside id="hud-right" class="rail" aria-label="Actions" data-i18n-aria="Actions">
        <h2 class="rail-title" data-i18n="Foreman's Panel">Foreman's Panel</h2>
        <div id="right-rail-body"></div>
      </aside>

      <nav id="hud-bottom" aria-label="Quick actions" data-i18n-aria="Quick actions"></nav>

      <button id="rail-toggle-left" class="rail-toggle" aria-label="Toggle shift report" data-i18n-aria="Toggle shift report" aria-expanded="false">◧</button>
      <button id="rail-toggle-right" class="rail-toggle" aria-label="Toggle actions" data-i18n-aria="Toggle actions" aria-expanded="false">◨</button>

      <div id="lesson-banner" class="hidden" role="note"></div>
      <div id="countdown" class="hidden" aria-live="assertive"></div>
    </div>

    <!-- ======================= SCREENS ======================= -->
    <section id="screen-boot" class="screen active" aria-label="Loading" data-i18n-aria="Loading">
      <div class="panel boot-panel">
        <h1 class="game-logo">DEEP<span>WORKS</span></h1>
        <div class="meter big"><div id="boot-fill"></div></div>
        <p id="boot-status">Waking the lift…</p>
      </div>
    </section>

    <section id="screen-title" class="screen" aria-label="Title" data-i18n-aria="Title">
      <div class="panel title-panel">
        <img id="title-art" class="title-art" src="assets/key-art.webp" alt="" onerror="this.style.display='none'">
        <h1 class="game-logo">DEEP<span>WORKS</span></h1>
        <p class="tagline" data-i18n="Assign. Upgrade. Optimize. The seams are glowing.">Assign. Upgrade. Optimize. The seams are glowing.</p>
        <div id="resume-banner" class="hidden"></div>
        <div class="title-buttons">
          <button id="btn-play" class="btn primary big" data-i18n="Play">Play</button>
          <button id="btn-daily" class="btn"><span data-i18n="Daily Vein">Daily Vein</span> <span id="daily-countdown" class="subtle"></span></button>
          <button id="btn-journey" class="btn"><span data-i18n="Journey">Journey</span> <span id="journey-progress-label" class="subtle"></span></button>
          <button id="btn-profile" class="btn ghost" data-i18n="Profile">Profile</button>
        </div>
        <nav class="title-links" aria-label="Secondary" data-i18n-aria="Secondary">
          <button id="btn-help" class="btn link" data-i18n="How to play">How to play</button>
          <button id="btn-boards" class="btn link" data-i18n="Leaderboards">Leaderboards</button>
          <button id="btn-settings" class="btn link" data-i18n="Settings">Settings</button>
        </nav>
        <div id="title-platform" class="title-links hidden">
          <button id="btn-signin" class="btn ghost hidden" data-i18n="Sign in with StarHermit">Sign in with StarHermit</button>
          <button id="btn-invite" class="btn ghost hidden" data-i18n="Invite a friend">Invite a friend</button>
        </div>
        <p id="title-identity" class="subtle"></p>
      </div>
    </section>

    <section id="screen-modes" class="screen" aria-label="Choose mode" data-i18n-aria="Choose mode">
      <div class="panel wide">
        <h2 data-i18n="Choose your shift">Choose your shift</h2>
        <div id="mode-grid" class="card-grid"></div>
        <button class="btn ghost back-btn" data-back data-i18n="← Back">← Back</button>
      </div>
    </section>

    <section id="screen-setup" class="screen" aria-label="Mode setup" data-i18n-aria="Mode setup">
      <div class="panel" id="setup-panel"></div>
    </section>

    <section id="screen-journey" class="screen" aria-label="Journey progression" data-i18n-aria="Journey progression">
      <div class="panel wide">
        <h2 data-i18n="Journey">Journey</h2>
        <p class="subtle" id="journey-summary"></p>
        <div id="journey-grid" class="journey-grid"></div>
        <button class="btn ghost back-btn" data-back data-i18n="← Back">← Back</button>
      </div>
    </section>

    <section id="screen-boards" class="screen" aria-label="Leaderboards" data-i18n-aria="Leaderboards">
      <div class="panel" id="boards-panel"></div>
    </section>

    <section id="screen-help" class="screen" aria-label="Help" data-i18n-aria="Help">
      <div class="panel wide">
        <h2 data-i18n="How to play">How to play</h2>
        <div id="help-body"></div>
        <button class="btn ghost back-btn" data-back data-i18n="← Back">← Back</button>
      </div>
    </section>

    <section id="screen-settings" class="screen" aria-label="Settings" data-i18n-aria="Settings">
      <div class="panel" id="settings-panel"></div>
    </section>

    <section id="screen-results" class="screen" aria-label="Results" data-i18n-aria="Results" aria-live="polite">
      <div class="panel" id="results-panel"></div>
    </section>

    <section id="screen-profile" class="screen" aria-label="Profile" data-i18n-aria="Profile">
      <div class="panel" id="profile-panel"></div>
    </section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="caption-root" aria-hidden="false"></div>
  <div id="live-polite" class="sr-only" aria-live="polite"></div>
  <div id="live-assertive" class="sr-only" aria-live="assertive"></div>
</div>

<script src="vendor/three.min.js"></script>
<!-- three.js r128 addons (examples/js, same revision as vendor/three.min.js) -->
<script src="vendor/three-r128-addons/EffectComposer.js"></script>
<script src="vendor/three-r128-addons/RenderPass.js"></script>
<script src="vendor/three-r128-addons/ShaderPass.js"></script>
<script src="vendor/three-r128-addons/CopyShader.js"></script>
<script src="vendor/three-r128-addons/LuminosityHighPassShader.js"></script>
<script src="vendor/three-r128-addons/UnrealBloomPass.js"></script>
<script src="vendor/three-r128-addons/FXAAShader.js"></script>
<script src="vendor/three-r128-addons/SMAAShader.js"></script>
<script src="vendor/three-r128-addons/SMAAPass.js"></script>
<script src="vendor/three-r128-addons/SimplexNoise.js"></script>
<script src="vendor/three-r128-addons/SSAOShader.js"></script>
<script src="vendor/three-r128-addons/SSAOPass.js"></script>
<script src="vendor/three-r128-addons/RoomEnvironment.js"></script>
<script src="js/locales/en-GB.js"></script>
<script src="js/locales/es.js"></script>
<script src="js/locales/de.js"></script>
<script src="js/locales/fr.js"></script>
<script src="js/locales/pt.js"></script>
<script src="js/locales/it.js"></script>
<script src="js/i18n.js"></script>
<script src="js/gfx.js"></script>
<script src="js/rules.js"></script>
<script src="js/content.js"></script>
<script src="js/session.js"></script>
<script src="starhermit-sdk.js"></script>
<script src="js/platform.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
